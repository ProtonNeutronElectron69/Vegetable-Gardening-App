<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phoenix Garden Guide</title>
  <meta name="description" content="Planting calendar and growing guide for vegetables and fruit in the Phoenix, Arizona metro area.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 30V15' stroke='%234d7c32' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M16 16C16 9 11 5 4 5c0 7 5 11 12 11zM16 13c0-6 4-10 11-10 0 6-4 10-11 10z' fill='%236a9f45'/%3E%3C/svg%3E">
  <!-- Apply the visitor's saved theme before anything draws, so the page never flashes the wrong look.
       The list of themes lives in js/app.js (THEMES); keep the two in sync. -->
  <script>
    (function () {
      var themes = ["patch", "sonoran", "plot", "harvest", "packet", "classic"];
      var saved = null;
      try { saved = localStorage.getItem("garden-guide-theme"); } catch (e) {}
      document.documentElement.setAttribute("data-skin", themes.indexOf(saved) >= 0 ? saved : themes[0]);
    })();
  </script>
  <link rel="stylesheet" href="css/styles.css?v=2026-10-30.3">
  <link rel="stylesheet" href="css/fonts/fonts.css?v=2026-10-30.3">
  <link rel="stylesheet" href="css/themes/sonoran.css?v=2026-10-30.3">
  <link rel="stylesheet" href="css/themes/plot.css?v=2026-10-30.3">
  <link rel="stylesheet" href="css/themes/patch.css?v=2026-10-30.3">
  <link rel="stylesheet" href="css/themes/harvest.css?v=2026-10-30.3">
  <link rel="stylesheet" href="css/themes/packet.css?v=2026-10-30.3">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#/calendar" aria-label="Phoenix Garden Guide home">
        <svg class="brand-icon" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M16 30V15" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/>
          <path d="M16 16C16 9 11 5 4 5c0 7 5 11 12 11zM16 13c0-6 4-10 11-10 0 6-4 10-11 10z" fill="currentColor"/>
        </svg>
        <span class="brand-text">
          <span class="brand-name">Phoenix Garden Guide</span>
          <span class="brand-tag">Vegetables &amp; fruit for the low desert</span>
        </span>
      </a>
      <nav class="site-nav" aria-label="Main">
        <a href="#/calendar" data-nav="calendar">Calendar</a>
        <a href="#/plants" data-nav="plants">Plants</a>
        <a href="#/gallery" data-nav="gallery">Gallery</a>
        <a href="#/about" data-nav="about">About</a>
      </nav>
      <div class="theme-picker">
        <button type="button" class="theme-btn" id="theme-btn" aria-haspopup="true" aria-expanded="false" aria-controls="theme-menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 0 0 0 18c1.1 0 1.8-.8 1.8-1.7 0-.5-.2-.8-.4-1.1-.3-.3-.4-.6-.4-1 0-.9.7-1.6 1.6-1.6H16a5 5 0 0 0 5-5C21 6.6 17 3 12 3Zm-5.5 9a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Zm3-4a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Zm5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Zm3 4a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Z"/></svg>
          <span class="theme-btn-label">Theme</span>
        </button>
        <div class="theme-menu" id="theme-menu" role="menu" aria-label="Choose a theme" hidden></div>
      </div>
    </div>
  </header>

  <main id="main" class="site-main" tabindex="-1">
    <noscript>
      <p class="notice">This guide needs JavaScript turned on in your browser.</p>
    </noscript>
  </main>

  <footer class="site-footer">
    <p>
      Planting dates follow University of Arizona Cooperative Extension guides for Maricopa County.
      Photos from Wikimedia Commons; see <a href="#/about">About</a> for sources and credits.
    </p>
  </footer>

  <dialog class="lightbox" id="lightbox" aria-label="Photo viewer">
    <div class="lightbox-inner">
      <button class="lightbox-close" type="button" data-lightbox="close" aria-label="Close photo viewer">&times;</button>
      <button class="lightbox-nav lightbox-prev" type="button" data-lightbox="prev" aria-label="Previous photo">&#8249;</button>
      <figure class="lightbox-figure">
        <img class="lightbox-img" alt="">
        <figcaption class="lightbox-caption"></figcaption>
      </figure>
      <button class="lightbox-nav lightbox-next" type="button" data-lightbox="next" aria-label="Next photo">&#8250;</button>
    </div>
  </dialog>

  <!-- Plain scripts (not modules) so the app also works when opened straight from a file.
       The ?v= value makes browsers fetch fresh copies after an update; change it on every release. -->
  <script src="js/data/sources.js?v=2026-10-30.3"></script>
  <script src="js/data/plants.js?v=2026-10-30.3"></script>
  <script src="js/data/photos.js?v=2026-10-30.3"></script>
  <script src="js/app.js?v=2026-10-30.3"></script>
</body>
</html>
